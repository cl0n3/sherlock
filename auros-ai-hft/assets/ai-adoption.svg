<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- gridlines -->
  <g stroke="#263244" stroke-width="1">
    <line x1="230" y1="40" x2="230" y2="290"/>
    <line x1="365" y1="40" x2="365" y2="290"/>
    <line x1="500" y1="40" x2="500" y2="290"/>
    <line x1="635" y1="40" x2="635" y2="290"/>
    <line x1="770" y1="40" x2="770" y2="290"/>
  </g>
  <!-- x labels -->
  <g fill="#94a3b8" font-size="13" text-anchor="middle">
    <text x="230" y="312">0%</text>
    <text x="365" y="312">25%</text>
    <text x="500" y="312">50%</text>
    <text x="635" y="312">75%</text>
    <text x="770" y="312">100%</text>
  </g>
  <!-- bars (5.4 px per %): Google ~30, GitHub 46, Coinbase 50 -->
  <g>
    <rect x="230" y="60"  width="162" height="44" fill="#2dd4bf"/>
    <rect x="230" y="135" width="248" height="44" fill="#2dd4bf"/>
    <rect x="230" y="210" width="270" height="44" fill="#2dd4bf"/>
  </g>
  <!-- company labels -->
  <g fill="#cbd5e1" font-size="16" text-anchor="end">
    <text x="215" y="88">Google</text>
    <text x="215" y="163">GitHub</text>
    <text x="215" y="238">Coinbase</text>
  </g>
  <!-- value labels -->
  <g fill="#5eead4" font-size="15" font-weight="700">
    <text x="402" y="88">~25–30%</text>
    <text x="488" y="163">46%</text>
    <text x="510" y="238">50%*</text>
  </g>
  <!-- footnote -->
  <text x="230" y="340" fill="#94a3b8" font-size="12" font-style="italic">Share of new code AI-written / assisted (company-reported, 2024–25). Google ≈25%+ new code (2024); GitHub Copilot; *Coinbase 2025 target, 33% reached. Definitions vary.</text>
</svg>

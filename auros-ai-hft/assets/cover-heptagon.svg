<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="halo" cx="50%" cy="46%" r="56%">
      <stop offset="0%" stop-color="#1a7a48" stop-opacity="0.24"/>
      <stop offset="68%" stop-color="#1a7a48" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a7a48" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#1f9d57" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- soft brand halo -->
  <circle cx="200" cy="188" r="184" fill="url(#halo)"/>

  <g filter="url(#glow)">
    <!-- regular (proper) heptagon, point-up -->
    <polygon points="200,50 317.27,106.48 346.24,233.38 265.08,335.15 134.92,335.15 53.76,233.38 82.73,106.48"
             fill="rgba(26,122,72,0.06)" stroke="#1a7a48" stroke-width="6" stroke-linejoin="round"/>
    <!-- capital H -->
    <g fill="#1a7a48">
      <rect x="156" y="142" width="20" height="116" rx="2"/>
      <rect x="224" y="142" width="20" height="116" rx="2"/>
      <rect x="156" y="190" width="88" height="20" rx="2"/>
    </g>
  </g>
</svg>

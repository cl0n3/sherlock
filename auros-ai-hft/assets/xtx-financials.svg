<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- gridlines -->
  <g stroke="#263244" stroke-width="1">
    <line x1="90" y1="410" x2="790" y2="410"/>
    <line x1="90" y1="321.9" x2="790" y2="321.9"/>
    <line x1="90" y1="233.8" x2="790" y2="233.8"/>
    <line x1="90" y1="145.7" x2="790" y2="145.7"/>
    <line x1="90" y1="57.6" x2="790" y2="57.6"/>
  </g>
  <!-- y axis labels -->
  <g fill="#94a3b8" font-size="14" text-anchor="end">
    <text x="78" y="415">£0</text>
    <text x="78" y="326.9">£1bn</text>
    <text x="78" y="238.8">£2bn</text>
    <text x="78" y="150.7">£3bn</text>
    <text x="78" y="62.6">£4bn</text>
  </g>
  <!-- legend -->
  <g font-size="14">
    <rect x="500" y="20" width="14" height="14" rx="3" fill="#2dd4bf"/>
    <text x="520" y="32" fill="#cbd5e1">Revenue</text>
    <rect x="620" y="20" width="14" height="14" rx="3" fill="#f5b042"/>
    <text x="640" y="32" fill="#cbd5e1">Profit (PAT)</text>
  </g>
  <!-- bars: revenue (teal) + profit (amber) -->
  <g>
    <!-- 2020 -->
    <rect x="110.3" y="352.6" width="34" height="57.4" fill="#2dd4bf"/>
    <rect x="152.3" y="381.8" width="34" height="28.2" fill="#f5b042"/>
    <!-- 2021 (estimate, dimmed) -->
    <rect x="227" y="277.9" width="34" height="132.1" fill="#2dd4bf" opacity="0.5"/>
    <rect x="269" y="351.0" width="34" height="59.0" fill="#f5b042" opacity="0.5"/>
    <!-- 2022 -->
    <rect x="343.7" y="189.8" width="34" height="220.2" fill="#2dd4bf"/>
    <rect x="385.7" y="313.1" width="34" height="96.9" fill="#f5b042"/>
    <!-- 2023 -->
    <rect x="460.3" y="233.8" width="34" height="176.2" fill="#2dd4bf"/>
    <rect x="502.3" y="336.4" width="34" height="73.6" fill="#f5b042"/>
    <!-- 2024 -->
    <rect x="577" y="168.6" width="34" height="241.4" fill="#2dd4bf"/>
    <rect x="619" y="297.2" width="34" height="112.8" fill="#f5b042"/>
    <!-- 2025 -->
    <rect x="693.7" y="63.8" width="34" height="346.2" fill="#2dd4bf"/>
    <rect x="735.7" y="259.4" width="34" height="150.6" fill="#f5b042"/>
  </g>
  <!-- value labels -->
  <g font-size="12" text-anchor="middle" fill="#5eead4">
    <text x="127.3" y="347.6">0.65</text>
    <text x="244" y="272.9" fill-opacity="0.7">1.5</text>
    <text x="360.7" y="184.8">2.5</text>
    <text x="477.3" y="228.8">2.0</text>
    <text x="594" y="163.6">2.74</text>
    <text x="710.7" y="58.8">3.93</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#f7c873">
    <text x="169.3" y="376.8">0.32</text>
    <text x="286" y="346" fill-opacity="0.7">0.67</text>
    <text x="402.7" y="308.1">1.1</text>
    <text x="519.3" y="331.4">0.84</text>
    <text x="636" y="292.2">1.28</text>
    <text x="752.7" y="254.4">1.71</text>
  </g>
  <!-- x axis labels -->
  <g fill="#cbd5e1" font-size="15" text-anchor="middle">
    <text x="148.3" y="432">2020</text>
    <text x="265" y="432" fill="#94a3b8">2021*</text>
    <text x="381.7" y="432">2022</text>
    <text x="498.3" y="432">2023</text>
    <text x="615" y="432">2024</text>
    <text x="731.7" y="432">2025</text>
  </g>
  <!-- footnote -->
  <text x="90" y="458" fill="#94a3b8" font-size="12.5" font-style="italic">Revenue &amp; profit after tax, £bn. *2021 estimated (dimmed); 2022–25 from Companies House filings / press. Approximate.</text>
</svg>

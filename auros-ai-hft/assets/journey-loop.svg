<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="t" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5cb8a8"/></marker>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#e6ab57"/></marker>
  </defs>

  <!-- boxes -->
  <rect x="70" y="66" width="200" height="96" rx="12" fill="#15202f" stroke="#5cb8a8" stroke-width="2"/>
  <text x="170" y="108" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Coder AI</text>
  <text x="170" y="133" text-anchor="middle" fill="#9fb6c8" font-size="13">builds the system</text>

  <rect x="450" y="66" width="200" height="96" rx="12" fill="#1d1c12" stroke="#e6ab57" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Reviewer AI</text>
  <text x="550" y="133" text-anchor="middle" fill="#d8c08a" font-size="13">verifies, not just reads</text>

  <!-- top arrow: coder -> reviewer -->
  <path d="M272,88 C330,52 390,52 448,88" fill="none" stroke="#5cb8a8" stroke-width="2" marker-end="url(#t)"/>
  <text x="360" y="48" text-anchor="middle" fill="#8fd0c4" font-size="13" font-weight="700">PR</text>

  <!-- bottom arrow: reviewer -> coder -->
  <path d="M448,140 C390,176 330,176 272,140" fill="none" stroke="#e6ab57" stroke-width="2" marker-end="url(#a)"/>
  <text x="360" y="192" text-anchor="middle" fill="#e6ab57" font-size="13">findings → re-review</text>

  <text x="360" y="224" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-style="italic">12 reviewed, CI-green PRs · tests 2 → 9 suites</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- gridlines -->
  <g stroke="#263244" stroke-width="1">
    <line x1="90" y1="410" x2="790" y2="410"/>
    <line x1="90" y1="332.9" x2="790" y2="332.9"/>
    <line x1="90" y1="255.8" x2="790" y2="255.8"/>
    <line x1="90" y1="178.8" x2="790" y2="178.8"/>
    <line x1="90" y1="101.7" x2="790" y2="101.7"/>
  </g>
  <!-- y axis labels -->
  <g fill="#94a3b8" font-size="14" text-anchor="end">
    <text x="78" y="415">€0</text>
    <text x="78" y="337.9">€1bn</text>
    <text x="78" y="260.8">€2bn</text>
    <text x="78" y="183.8">€3bn</text>
    <text x="78" y="106.7">€4bn</text>
  </g>
  <!-- legend -->
  <g font-size="14">
    <rect x="430" y="20" width="14" height="14" rx="3" fill="#2dd4bf"/>
    <text x="450" y="32" fill="#cbd5e1">Net trading income</text>
    <rect x="640" y="20" width="14" height="14" rx="3" fill="#f5b042"/>
    <text x="660" y="32" fill="#cbd5e1">Net profit</text>
  </g>
  <!-- bars: NTI (teal) + profit (amber) -->
  <g>
    <!-- 2021 -->
    <rect x="115" y="232.7" width="40" height="177.3" fill="#2dd4bf"/>
    <rect x="165" y="336.2" width="40" height="73.8" fill="#f5b042"/>
    <!-- 2022 -->
    <rect x="255" y="155.6" width="40" height="254.4" fill="#2dd4bf"/>
    <rect x="305" y="310.9" width="40" height="99.1" fill="#f5b042"/>
    <!-- 2023 -->
    <rect x="395" y="196.2" width="40" height="213.8" fill="#2dd4bf"/>
    <rect x="445" y="320.7" width="40" height="89.3" fill="#f5b042"/>
    <!-- 2024 -->
    <rect x="535" y="140.7" width="40" height="269.3" fill="#2dd4bf"/>
    <rect x="585" y="304.5" width="40" height="105.5" fill="#f5b042"/>
    <!-- 2025 -->
    <rect x="675" y="58.8" width="40" height="351.2" fill="#2dd4bf"/>
    <rect x="725" y="273.6" width="40" height="136.4" fill="#f5b042"/>
  </g>
  <!-- value labels -->
  <g font-size="12" text-anchor="middle" fill="#5eead4">
    <text x="135" y="227.7">2.30</text>
    <text x="275" y="150.6">3.30</text>
    <text x="415" y="191.2">2.77</text>
    <text x="555" y="135.7">3.49</text>
    <text x="695" y="53.8">4.56</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#f7c873">
    <text x="185" y="331.2">0.96</text>
    <text x="325" y="305.9">1.29</text>
    <text x="465" y="315.7">1.16</text>
    <text x="605" y="299.5">1.37</text>
    <text x="745" y="268.6">1.77</text>
  </g>
  <!-- x axis labels -->
  <g fill="#cbd5e1" font-size="15" text-anchor="middle">
    <text x="160" y="432">2021</text>
    <text x="300" y="432">2022</text>
    <text x="440" y="432">2023</text>
    <text x="580" y="432">2024</text>
    <text x="720" y="432">2025</text>
  </g>
  <!-- footnote -->
  <text x="90" y="458" fill="#94a3b8" font-size="12.5" font-style="italic">Net trading income &amp; net profit, €bn. Source: Optiver Holding B.V. annual results 2021–2025. Verify vs primary filings.</text>
</svg>

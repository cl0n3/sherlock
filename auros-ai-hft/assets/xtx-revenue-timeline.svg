<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- legend -->
  <g font-size="12.5">
    <rect x="95" y="16" width="13" height="13" rx="2" fill="#5cb8a8" opacity="0.4"/>
    <text x="113" y="27" fill="#cbd5e1">2016–19 · single entity</text>
    <rect x="300" y="16" width="13" height="13" rx="2" fill="#5cb8a8"/>
    <text x="318" y="27" fill="#cbd5e1">2020–25 · combined group</text>
  </g>

  <!-- gridlines -->
  <g stroke="#263244" stroke-width="1">
    <line x1="90" y1="400" x2="820" y2="400"/>
    <line x1="90" y1="316.7" x2="820" y2="316.7"/>
    <line x1="90" y1="233.3" x2="820" y2="233.3"/>
    <line x1="90" y1="150" x2="820" y2="150"/>
    <line x1="90" y1="66.7" x2="820" y2="66.7"/>
  </g>
  <!-- y labels -->
  <g fill="#94a3b8" font-size="13" text-anchor="end">
    <text x="78" y="405">£0</text>
    <text x="78" y="321.7">£1bn</text>
    <text x="78" y="238.3">£2bn</text>
    <text x="78" y="155">£3bn</text>
    <text x="78" y="71.7">£4bn</text>
  </g>

  <!-- bars: 2016-19 dim (single entity) -->
  <g fill="#5cb8a8" opacity="0.4">
    <rect x="106.5" y="389.0" width="40" height="11.0"/>
    <rect x="179.5" y="387.1" width="40" height="12.9"/>
    <rect x="252.5" y="374.6" width="40" height="25.4"/>
    <rect x="325.5" y="371.7" width="40" height="28.3"/>
  </g>
  <!-- bars: 2020-25 full (combined group) -->
  <g fill="#5cb8a8">
    <rect x="398.5" y="312.3" width="40" height="87.7"/>
    <rect x="471.5" y="276.9" width="40" height="123.1"/>
    <rect x="544.5" y="192.9" width="40" height="207.1"/>
    <rect x="617.5" y="232.7" width="40" height="167.3"/>
    <rect x="690.5" y="171.7" width="40" height="228.3"/>
    <rect x="763.5" y="72.5" width="40" height="327.5"/>
  </g>

  <!-- value labels (£bn) -->
  <g fill="#cbd5e1" font-size="11" text-anchor="middle">
    <text x="126.5" y="384">0.13</text>
    <text x="199.5" y="382">0.15</text>
    <text x="272.5" y="370">0.31</text>
    <text x="345.5" y="367">0.34</text>
    <text x="418.5" y="307">1.05</text>
    <text x="491.5" y="272">1.48</text>
    <text x="564.5" y="188">2.49</text>
    <text x="637.5" y="228">2.01</text>
    <text x="710.5" y="167">2.74</text>
    <text x="783.5" y="68">3.93</text>
  </g>

  <!-- "Attention" paper annotation at 2017 -->
  <line x1="199.5" y1="214" x2="199.5" y2="384" stroke="#f5b042" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="199.5" y="190" text-anchor="middle" fill="#f5b042" font-size="12" font-weight="700">'Attention Is All You Need'</text>
  <text x="199.5" y="206" text-anchor="middle" fill="#f5b042" font-size="12">paper · Jun 2017</text>

  <!-- 2020 restructure break -->
  <line x1="382" y1="112" x2="382" y2="400" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="382" y="88" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700">2020: entity restructure</text>
  <text x="382" y="104" text-anchor="middle" fill="#94a3b8" font-size="12">+ COVID — series breaks</text>

  <!-- x axis baseline + year labels -->
  <line x1="90" y1="400" x2="820" y2="400" stroke="#3a4658" stroke-width="1.5"/>
  <g fill="#cbd5e1" font-size="13" text-anchor="middle">
    <text x="126.5" y="420">2016</text>
    <text x="199.5" y="420">2017</text>
    <text x="272.5" y="420">2018</text>
    <text x="345.5" y="420">2019</text>
    <text x="418.5" y="420">2020</text>
    <text x="491.5" y="420">2021</text>
    <text x="564.5" y="420">2022</text>
    <text x="637.5" y="420">2023</text>
    <text x="710.5" y="420">2024</text>
    <text x="783.5" y="420">2025</text>
  </g>

  <!-- footnote -->
  <text x="90" y="452" fill="#94a3b8" font-size="11.5" font-style="italic">Group revenue, £bn. 2016–19 = XTX Markets Ltd (single entity); 2020–25 = combined 3 UK entities — not directly comparable across the 2020 restructure. Source: Companies House / press.</text>
</svg>

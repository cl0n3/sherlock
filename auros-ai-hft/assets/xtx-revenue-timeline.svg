<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- legend -->
  <g font-size="12.5">
    <rect x="120" y="14" width="14" height="14" rx="3" fill="#5cb8a8"/>
    <text x="140" y="26" fill="#cbd5e1">XTX revenue</text>
    <line x1="250" y1="21" x2="276" y2="21" stroke="#a78bfa" stroke-width="2.5"/><circle cx="263" cy="21" r="3" fill="#a78bfa"/>
    <text x="282" y="26" fill="#cbd5e1">XTX headcount</text>
    <line x1="420" y1="21" x2="446" y2="21" stroke="#e6ab57" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="452" y="26" fill="#cbd5e1">Optiver (2025 reference)</text>
  </g>

  <!-- left-axis gridlines (revenue, 0–4.5bn) -->
  <g stroke="#263244" stroke-width="1">
    <line x1="90" y1="324.4" x2="800" y2="324.4"/>
    <line x1="90" y1="248.9" x2="800" y2="248.9"/>
    <line x1="90" y1="173.3" x2="800" y2="173.3"/>
    <line x1="90" y1="97.8" x2="800" y2="97.8"/>
  </g>
  <!-- left y labels (revenue) -->
  <g fill="#94a3b8" font-size="13" text-anchor="end">
    <text x="80" y="405">£0</text>
    <text x="80" y="329">£1bn</text>
    <text x="80" y="253">£2bn</text>
    <text x="80" y="178">£3bn</text>
    <text x="80" y="102">£4bn</text>
  </g>
  <!-- right y labels (headcount, 0–2800) -->
  <g fill="#9a86c8" font-size="13" text-anchor="start">
    <text x="808" y="405">0</text>
    <text x="808" y="283">1,000</text>
    <text x="808" y="162">2,000</text>
    <text x="808" y="46" font-size="11">staff</text>
  </g>

  <!-- XTX revenue bars: 2016–19 dim (single entity) -->
  <g fill="#5cb8a8" opacity="0.4">
    <rect x="105.5" y="390.2" width="40" height="9.8"/>
    <rect x="176.5" y="388.7" width="40" height="11.3"/>
    <rect x="247.5" y="376.6" width="40" height="23.4"/>
    <rect x="318.5" y="374.3" width="40" height="25.7"/>
  </g>
  <!-- XTX revenue bars: 2020–25 full (combined group) -->
  <g fill="#5cb8a8">
    <rect x="389.5" y="320.7" width="40" height="79.3"/>
    <rect x="460.5" y="288.2" width="40" height="111.8"/>
    <rect x="531.5" y="211.9" width="40" height="188.1"/>
    <rect x="602.5" y="248.1" width="40" height="151.9"/>
    <rect x="673.5" y="193.0" width="40" height="207.0"/>
    <rect x="744.5" y="103.1" width="40" height="296.9"/>
  </g>
  <!-- XTX revenue value labels (£bn) -->
  <g fill="#cbd5e1" font-size="10.5" text-anchor="middle">
    <text x="125.5" y="385">0.13</text><text x="196.5" y="384">0.15</text><text x="267.5" y="372">0.31</text>
    <text x="338.5" y="369">0.34</text><text x="409.5" y="316">1.05</text><text x="480.5" y="283">1.48</text>
    <text x="551.5" y="207">2.49</text><text x="622.5" y="243">2.01</text><text x="693.5" y="188">2.74</text><text x="764.5" y="98">3.93</text>
  </g>

  <!-- Optiver 2025 revenue reference line (£3.9bn, left axis) -->
  <line x1="90" y1="105.3" x2="800" y2="105.3" stroke="#e6ab57" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="797" y="100" text-anchor="end" fill="#e6ab57" font-size="12" font-weight="600">Optiver ≈ £3.9bn revenue</text>

  <!-- Optiver 2025 headcount reference line (~2,600, right axis 0–2800) -->
  <line x1="90" y1="84.3" x2="800" y2="84.3" stroke="#e6ab57" stroke-width="1.6" stroke-dasharray="2 3"/>
  <text x="797" y="79" text-anchor="end" fill="#e6ab57" font-size="12" font-weight="600">Optiver ≈ 2,600 staff</text>

  <!-- XTX headcount line (right axis, low) -->
  <polyline points="125.5,395.1 196.5,391.5 267.5,386.6 338.5,383.0 409.5,379.9 480.5,376.9 551.5,373.3 622.5,370.9 693.5,369.6 764.5,368.4"
            fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <g fill="#a78bfa"><circle cx="125.5" cy="395.1" r="2.6"/><circle cx="764.5" cy="368.4" r="3"/></g>
  <text x="781" y="365" text-anchor="start" fill="#b9a6e8" font-size="11.5">XTX ≈260</text>

  <!-- the gap callout -->
  <text x="430" y="150" text-anchor="middle" fill="#f0c074" font-size="15" font-weight="700">same revenue · ~1/10th the staff</text>

  <!-- x axis + year labels -->
  <line x1="90" y1="400" x2="800" y2="400" stroke="#3a4658" stroke-width="1.5"/>
  <g fill="#cbd5e1" font-size="12.5" text-anchor="middle">
    <text x="125.5" y="419">2016</text><text x="196.5" y="419">2017</text><text x="267.5" y="419">2018</text>
    <text x="338.5" y="419">2019</text><text x="409.5" y="419">2020</text><text x="480.5" y="419">2021</text>
    <text x="551.5" y="419">2022</text><text x="622.5" y="419">2023</text><text x="693.5" y="419">2024</text><text x="764.5" y="419">2025</text>
  </g>

  <!-- footnote -->
  <text x="90" y="450" fill="#94a3b8" font-size="11" font-style="italic">XTX revenue bars (turnover; 2016–19 single entity, 2020+ combined group) + headcount line (approx). Optiver shown as 2025 reference: NTI ≈£3.9bn (€4.6bn), ~2,600 staff. €→£ approx.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <line x1="200" y1="30" x2="200" y2="322" stroke="#3a4658" stroke-width="1.5"/>

  <!-- bars (2.9 px per month; scale 0–200 months) -->
  <g fill="#5cb8a8">
    <rect x="200" y="36"  width="557" height="34"/>
    <rect x="200" y="86"  width="244" height="34"/>
    <rect x="200" y="136" width="157" height="34"/>
    <rect x="200" y="186" width="87"  height="34"/>
    <rect x="200" y="236" width="26"  height="34"/>
  </g>
  <rect x="200" y="286" width="6" height="34" fill="#e6ab57"/>

  <!-- left labels -->
  <g font-size="14.5" text-anchor="end" fill="#cbd5e1">
    <text x="188" y="58">Mobile phone</text>
    <text x="188" y="108">World Wide Web</text>
    <text x="188" y="158">Facebook</text>
    <text x="188" y="208">Instagram</text>
    <text x="188" y="258">TikTok</text>
    <text x="188" y="308" fill="#f0c074" font-weight="700">ChatGPT</text>
  </g>

  <!-- value labels -->
  <g font-size="13.5" fill="#9fb6c8">
    <text x="767" y="58">~16 yrs</text>
    <text x="454" y="108">~7 yrs</text>
    <text x="367" y="158">~4.5 yrs</text>
    <text x="297" y="208">~2.5 yrs</text>
    <text x="236" y="258">~9 mo</text>
    <text x="216" y="308" fill="#f0c074" font-weight="700">~2 months — fastest ever</text>
  </g>

  <text x="200" y="348" fill="#7e8ea0" font-size="11.5" font-style="italic">Approx. time to reach 100M users · widely-reported figures.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#8fd0c4"/>
    </marker>
  </defs>

  <!-- arrows -->
  <g stroke="#8fd0c4" stroke-width="2">
    <line x1="112" y1="132" x2="146" y2="132" marker-end="url(#ar)"/>
    <line x1="308" y1="132" x2="368" y2="132" marker-end="url(#ar)"/>
    <line x1="530" y1="132" x2="590" y2="132" marker-end="url(#ar)"/>
    <line x1="752" y1="132" x2="786" y2="132" marker-end="url(#ar)"/>
  </g>
  <g fill="#9fb6c8" font-size="11.5" text-anchor="middle">
    <text x="129" y="120">WS</text>
    <text x="338" y="120">SHM ring · lock-free</text>
    <text x="560" y="120">AF_UNIX</text>
    <text x="769" y="120">REST</text>
  </g>

  <!-- exchange nodes -->
  <g>
    <rect x="18" y="100" width="92" height="64" rx="10" fill="#131a26" stroke="#46566c" stroke-width="1.5"/>
    <text x="64" y="129" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Binance</text>
    <text x="64" y="148" text-anchor="middle" fill="#7e8ea0" font-size="11">market data</text>
    <rect x="790" y="100" width="92" height="64" rx="10" fill="#131a26" stroke="#46566c" stroke-width="1.5"/>
    <text x="836" y="129" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="600">Binance</text>
    <text x="836" y="148" text-anchor="middle" fill="#7e8ea0" font-size="11">orders</text>
  </g>

  <!-- process boxes -->
  <g>
    <rect x="150" y="100" width="158" height="64" rx="10" fill="#15202f" stroke="#5cb8a8" stroke-width="1.8"/>
    <text x="229" y="128" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">md-gateway</text>
    <text x="229" y="147" text-anchor="middle" fill="#9fb6c8" font-size="11">WebSocket → SHM</text>

    <rect x="372" y="100" width="158" height="64" rx="10" fill="#15202f" stroke="#5cb8a8" stroke-width="1.8"/>
    <text x="451" y="128" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">autotrader</text>
    <text x="451" y="147" text-anchor="middle" fill="#9fb6c8" font-size="11">signals · risk · fills</text>

    <rect x="594" y="100" width="158" height="64" rx="10" fill="#15202f" stroke="#5cb8a8" stroke-width="1.8"/>
    <text x="673" y="128" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">order-gateway</text>
    <text x="673" y="147" text-anchor="middle" fill="#9fb6c8" font-size="11">REST · HMAC sign</text>
  </g>

  <text x="450" y="210" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-style="italic">Three isolated processes · all protobuf-encoded · ~6,700 lines of C++20</text>
</svg>

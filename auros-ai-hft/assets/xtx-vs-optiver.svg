<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- legend -->
  <g font-size="13">
    <rect x="300" y="12" width="14" height="14" rx="3" fill="#5cb8a8"/>
    <text x="320" y="24" fill="#cbd5e1">XTX</text>
    <rect x="392" y="12" width="14" height="14" rx="3" fill="#e6ab57"/>
    <text x="412" y="24" fill="#cbd5e1">Optiver</text>
  </g>

  <!-- group captions -->
  <text x="250" y="76" text-anchor="middle" fill="#8fd0c4" font-size="20" font-weight="700">≈ matched</text>
  <text x="646" y="76" text-anchor="middle" fill="#f0c074" font-size="26" font-weight="800">~1 / 10th</text>

  <!-- baseline -->
  <line x1="140" y1="360" x2="760" y2="360" stroke="#3a4658" stroke-width="1.5"/>
  <!-- divider between groups -->
  <line x1="455" y1="92" x2="455" y2="396" stroke="#263244" stroke-width="1.2" stroke-dasharray="4 5"/>

  <!-- GROUP 1 — Revenue (scaled to ~£4.2bn) -->
  <rect x="170" y="98"  width="64" height="262" fill="#5cb8a8"/>
  <rect x="266" y="100" width="64" height="260" fill="#e6ab57"/>
  <g text-anchor="middle" font-weight="700" font-size="15" fill="#e7eef6">
    <text x="202" y="90">£3.9bn</text>
    <text x="298" y="92">≈£3.9bn</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#94a3b8">
    <text x="202" y="380">XTX</text>
    <text x="298" y="380">Optiver</text>
  </g>
  <text x="250" y="408" text-anchor="middle" fill="#aebfd2" font-size="13" font-weight="600" letter-spacing="1.5">REVENUE (2025)</text>

  <!-- GROUP 2 — Headcount (scaled to ~2,800) -->
  <rect x="566" y="334" width="64" height="26"  fill="#5cb8a8"/>
  <rect x="662" y="100" width="64" height="260" fill="#e6ab57"/>
  <g text-anchor="middle" font-weight="700" font-size="15" fill="#e7eef6">
    <text x="598" y="326">~260</text>
    <text x="694" y="92">~2,600</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#94a3b8">
    <text x="598" y="380">XTX</text>
    <text x="694" y="380">Optiver</text>
  </g>
  <text x="646" y="408" text-anchor="middle" fill="#aebfd2" font-size="13" font-weight="600" letter-spacing="1.5">HEADCOUNT</text>

  <!-- footnote -->
  <text x="140" y="432" fill="#94a3b8" font-size="11.5" font-style="italic">XTX revenue (turnover) vs Optiver net trading income, 2025 (€→£ approx). Headcount approximate, group-wide. Bars scaled per metric.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="tick" markerWidth="6" markerHeight="12" refX="3" refY="6" orient="auto"><path d="M3,0 L3,12" stroke="#94a3b8" stroke-width="1.5"/></marker>
  </defs>

  <!-- row labels -->
  <text x="168" y="90" text-anchor="end" fill="#cbd5e1" font-size="16" font-weight="600">Traditional</text>
  <text x="168" y="186" text-anchor="end" fill="#cbd5e1" font-size="16" font-weight="600">With AI</text>

  <!-- Traditional bar: stages across 600px (180..780) -->
  <g>
    <rect x="180" y="66" width="90"  height="46" fill="#60a5fa"/>
    <rect x="270" y="66" width="210" height="46" fill="#2dd4bf"/>
    <rect x="480" y="66" width="120" height="46" fill="#f5b042"/>
    <rect x="600" y="66" width="100" height="46" fill="#a78bfa"/>
    <rect x="700" y="66" width="80"  height="46" fill="#34d399"/>
  </g>

  <!-- With-AI bar: same stages, ~40% scale (240px, 180..420) -->
  <g>
    <rect x="180" y="162" width="36" height="46" fill="#60a5fa"/>
    <rect x="216" y="162" width="84" height="46" fill="#2dd4bf"/>
    <rect x="300" y="162" width="48" height="46" fill="#f5b042"/>
    <rect x="348" y="162" width="40" height="46" fill="#a78bfa"/>
    <rect x="388" y="162" width="32" height="46" fill="#34d399"/>
  </g>

  <!-- saved-time bracket under the AI bar -->
  <line x1="420" y1="230" x2="780" y2="230" stroke="#94a3b8" stroke-width="1.6" marker-start="url(#tick)" marker-end="url(#tick)"/>
  <text x="600" y="223" text-anchor="middle" fill="#f5b042" font-size="14" font-weight="700">time-to-market saved (~60%)</text>

  <!-- stage legend -->
  <g font-size="13" fill="#cbd5e1">
    <rect x="180" y="262" width="13" height="13" rx="2" fill="#60a5fa"/><text x="199" y="273">Spec</text>
    <rect x="262" y="262" width="13" height="13" rx="2" fill="#2dd4bf"/><text x="281" y="273">Build</text>
    <rect x="350" y="262" width="13" height="13" rx="2" fill="#f5b042"/><text x="369" y="273">Test</text>
    <rect x="430" y="262" width="13" height="13" rx="2" fill="#a78bfa"/><text x="449" y="273">Integrate</text>
    <rect x="548" y="262" width="13" height="13" rx="2" fill="#34d399"/><text x="567" y="273">Ship</text>
  </g>
</svg>
